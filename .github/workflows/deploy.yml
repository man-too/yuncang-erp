name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package code
        run: |
          tar czf code.tar.gz \
            --exclude='erp-backend/__pycache__' \
            --exclude='erp-backend/*.pyc' \
            --exclude='erp-backend/.env' \
            --exclude='erp-backend/uvicorn' \
            --exclude='erp-frontend/node_modules' \
            --exclude='erp-frontend/dist' \
            erp-backend erp-frontend docker-compose.yml

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: code.tar.gz
          target: /tmp/erp-deploy

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SERVER_ENV
          script: |
            mkdir -p /var/www/erp-system
            tar xzf /tmp/erp-deploy/code.tar.gz -C /var/www/erp-system
            rm -rf /tmp/erp-deploy
            cd /var/www/erp-system
            # Preserve .env (not in repo)
            if [ ! -f erp-backend/.env ] && [ -n "$SERVER_ENV" ]; then
              echo "$SERVER_ENV" > erp-backend/.env
            fi
            docker compose build --parallel
            docker compose up -d
