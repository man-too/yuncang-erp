name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package code
        run: |
          mkdir -p deploy-pkg
          cp -r erp-backend deploy-pkg/
          cp -r erp-frontend deploy-pkg/ --exclude=erp-frontend/node_modules
          cp -r deploy deploy-pkg/
          cp docker-compose.yml deploy-pkg/
          cd deploy-pkg
          tar czf ../code.tar.gz .
          cd ..

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: code.tar.gz
          target: /tmp/erp-deploy

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SERVER_ENV
          script: |
            mkdir -p /var/www/erp-system
            tar xzf /tmp/erp-deploy/code.tar.gz -C /var/www/erp-system
            rm -rf /tmp/erp-deploy
            cd /var/www/erp-system
            # Preserve .env (not in repo)
            if [ ! -f erp-backend/.env ] && [ -n "$SERVER_ENV" ]; then
              echo "$SERVER_ENV" > erp-backend/.env
            fi
            docker compose build --parallel
            docker compose up -d
